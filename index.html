<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#192a22" />
    <meta
      name="description"
      content="Небесный рубеж — стратегия в реальном времени. Постройте город с нуля, развивайте экономику и защитите вечернее небо."
    />
    <title>8.15.0 · Небесный рубеж · Снабжение, флот и новые ракеты</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23121e23'/%3E%3Cpath d='M12 42 32 12 52 42 32 34Z' fill='%23b1ead0'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="src/ui/style.css" />
    <link rel="stylesheet" href="src/ui/army.css" />
    <link rel="stylesheet" href="src/ui/multiplayer.css" />
    <link rel="stylesheet" href="src/ui/districts.css" />
    <link rel="stylesheet" href="src/ui/recruitment.css" />
    <link rel="stylesheet" href="src/ui/frontline.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading" role="status">Загружаем город…</div>
    </div>
    <script>
      (() => {
        const node = document.querySelector('.boot-loading');
        if (!node) return;
        let finished = false;
        const cleanup = () => {
          finished = true;
          clearTimeout(timer);
          observer.disconnect();
          window.removeEventListener('error', failed);
          window.removeEventListener('unhandledrejection', failed);
        };
        const show = (message) => {
          if (finished) return;
          if (!node.isConnected) return cleanup();
          node.replaceChildren(document.createTextNode(message));
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = 'Повторить загрузку';
          button.style.cssText = 'display:block;margin:16px auto;padding:10px 16px';
          button.onclick = () => location.reload();
          node.append(button);
        };
        const failed = () =>
          show(
            'Не удалось запустить игру. Проверьте соединение и попробуйте обновить страницу. Если ошибка повторяется, откройте игру в современном Chrome или Edge с аппаратным ускорением.',
          );
        const timer = setTimeout(() => {
          show(
            'Игра ещё загружается. При медленном соединении подождите. Если загрузка остановилась, попробуйте обновить страницу.',
          );
        }, 30000);
        const observer = new MutationObserver(() => {
          if (!node.isConnected) cleanup();
        });
        observer.observe(document.getElementById('app'), { childList: true, subtree: true });
        window.addEventListener('error', failed);
        window.addEventListener('unhandledrejection', failed);
      })();
    </script>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"></dialog>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
    <noscript>Для игры включите JavaScript в браузере.</noscript>
  </body>
</html>
