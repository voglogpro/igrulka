<!doctype html>
<html lang="ru">
  <meta charset="utf-8" />
  <title>Skyfront owned transparency proof</title>
  <style>
    html,
    body {
      margin: 0;
      background: transparent;
      width: 100%;
      height: 100%;
      font: 18px system-ui;
      color: #e4eadc;
    }
    section {
      position: absolute;
      left: 60px;
      top: 60px;
      width: 520px;
      padding: 28px;
      border: 1px solid #c5b17b;
      background: #16221ed9;
      border-radius: 8px;
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
    }
    button {
      font: inherit;
      color: inherit;
      background: #42533d;
      border: 1px solid #b8bd93;
      padding: 10px 18px;
      cursor: pointer;
    }
    #status {
      color: #d9b778;
    }
  </style>
  <section>
    <h1>Небесный рубеж — прозрачный интерфейс</h1>
    <p>
      Это собственное проверочное окно. Вне карточки страница прозрачная; игра и частный рабочий
      стол не захватываются.
    </p>
    <button id="probe">Проверить IPC</button>
    <p id="status">Ожидание сообщения хоста</p>
  </section>
  <script>
    const send = (value) => window.chrome.webview.postMessage(value);
    document.querySelector('#probe').onclick = () => send({ kind: 'proof-click' });
    window.chrome.webview.addEventListener('message', (event) => {
      document.querySelector('#status').textContent = JSON.stringify(event.data);
      send({ kind: 'proof-received', data: event.data });
    });
    send({
      kind: 'proof-loaded',
      secureContext: window.isSecureContext,
      origin: location.origin,
      background: getComputedStyle(document.documentElement).backgroundColor,
    });
  </script>
</html>
