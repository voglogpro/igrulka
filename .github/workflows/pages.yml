name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare standalone game
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p "_site/releases/$version" _site/releases/8.10.3 _site/releases/8.11.0 _site/releases/8.11.1 _site/releases/8.11.2 _site/releases/8.12.0 _site/releases/8.12.1 _site/releases/8.13.0 _site/releases/8.13.1 _site/releases/8.13.2 _site/releases/8.13.3
          cp play/Skyfront.html "_site/releases/$version/index.html"
          # The old running servers advertise the root URL with protocol 10.
          # Keep their client stable while new invitations use a versioned path.
          git show 4b084d422ba54c0845371ebddbabc2c0cb2c0f88:play/Skyfront.html > _site/index.html
          cp _site/index.html _site/releases/8.10.3/index.html
          git show a66497e8d47af23a0661a88327f55073559288c4:play/Skyfront.html > _site/releases/8.11.0/index.html
          git show 2d20ca02168d9c6b200b72a74c17c9abf535e8e5:play/Skyfront.html > _site/releases/8.11.1/index.html
          git show 7f2881ba72b9240174e15a4093aeb4b620f78348:play/Skyfront.html > _site/releases/8.11.2/index.html
          git show 78643d83fa5be093fb5d94c3efc39db4f78815d5:play/Skyfront.html > _site/releases/8.12.0/index.html
          git show c4f17c3999eafc51b171a1ffe578dff1c365c2a9:play/Skyfront.html > _site/releases/8.12.1/index.html
          git show 7d528c937c6364718c1cab763a8a992f2efacfaf:play/Skyfront.html > _site/releases/8.13.0/index.html
          git show cbabc0a4d43d739c8ee44e9cc9ca4af8ea0f66c8:play/Skyfront.html > _site/releases/8.13.1/index.html
          git show b4bf9c4b3305fb51a59a482c121dffb201079186:play/Skyfront.html > _site/releases/8.13.2/index.html
          git show 761829fa5cbd30453b9aacbb363bf430887e2e27:play/Skyfront.html > _site/releases/8.13.3/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy standalone game
        id: deployment
        uses: actions/deploy-pages@v4
